<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        border: 1px solid;
        width: 100%;
        height: 100px;
        margin-bottom: 10px;
        text-align: center;
        font-size: 40px;
      }

      #d1 {
        background-color: aqua;
      }
      #d2 {
        background-color: red;
        color: white;
        display: none;
      }
      #d3 {
        background-color: yellow;
      }
      #d4 {
        background-color: blue;
        color: white;
      }

      #d1:hover + #d2 {
        display: block;
      }

      #title {
        display: none;
      }
      #icon:hover + #title {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div id="d1">Div 1</div>
    <div id="d2">Div 2</div>
    <div id="d3">Div 3</div>
    <div id="d4">Div 4</div>

    <div style="text-align: left">
      <span id="icon">🏡</span>
      <span id="title">Home</span>
    </div>
  </body>
</html>
