<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        border: 1px solid red;
        height: 600px;
        display: flex;
        flex-direction: row;
      }

      .container > div {
        width: 100px;
        height: 100px;
        border: 1px solid navy;
      }

      .container > div:nth-child(odd) {
        background-color: yellow;
      }
      .container > div:nth-child(even) {
        background-color: skyblue;
      }

      #d1 {
        order: 1;
        flex-grow: 1;
        flex-shrink: 1;
        flex-basis: 100%;
      }
      #d2 {
        order: 2;
        flex-grow: 1;
        flex-shrink: 1;
      }
      #d3 {
        order: 3;
        flex-grow: 1;
        flex-shrink: 1;
      }
    </style>
  </head>
  <body>
    <!-- div.container>div#d${MyDiv $}*5 -->
    <div class="container">
      <div id="d1">MyDiv 1</div>
      <div id="d2">MyDiv 2</div>
      <div id="d3">MyDiv 3</div>
    </div>
  </body>
</html>
