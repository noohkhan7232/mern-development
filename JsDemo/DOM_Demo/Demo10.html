<!doctype html>
<html lang="en">
  <head>
    <title>Document</title>
    <style>
      .cls1 {
        background-color: yellow;
        color: navy;
        padding: 20px;
      }
      .cls2 {
        text-align: center;
        font-family: chiller;
        font-size: x-large;
        box-shadow: 0px 4px 8px 3px grey;
      }
    </style>
  </head>
  <body>
    <h1 align="center">DOM Demo Page 10</h1>
    <h1 class="cls1">Heading 1</h1>
    <p class="cls1">Lorem ipsum dolor sit amet consectetur.</p>
    <h1>Heading 2</h1>
    <h1>Heading 3</h1>
    <span class="cls1">This is Span</span>

    <button onclick="myfun()">Button</button>

    <script>
      function myfun() {
        let eleList = document.getElementsByClassName("cls1");
        for (let ele of eleList) {
          ele.style.fontSize = "20px";
          ele.style.fontFamily = "elephant";
        }
      }
    </script>
  </body>
</html>
