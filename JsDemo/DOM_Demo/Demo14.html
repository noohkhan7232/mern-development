<!doctype html>
<html lang="en">
  <head>
    <title>Document</title>
    <style></style>
  </head>
  <body>
    <h1 align="center">DOM Demo Page 14</h1>

    <script>
      let table = document.createElement("table");
      table.setAttribute("border", "5px");
      table.setAttribute("width", "500px");
      table.setAttribute("align", "center");
      let row = table.insertRow();

      let col1 = row.insertCell();
      col1.textContent = "Sachin";

      let col2 = row.insertCell();
      let inp = document.createElement("input");
      inp.setAttribute("type", "text");
      inp.setAttribute("name", "unm");
      inp.setAttribute("placeholder", "Enter Name");
      col2.append(inp);

      let col3 = row.insertCell();
      col3.textContent = "Column 3";

      document.body.append(table);
      console.log(table);
    </script>
  </body>
</html>
