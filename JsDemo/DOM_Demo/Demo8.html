<!doctype html>
<html lang="en">
  <head>
    <title>Document</title>
    <style>
      .cls1 {
        background-color: yellow;
        color: navy;
        padding: 20px;
      }
      .cls2 {
        text-align: center;
        font-family: chiller;
        font-size: x-large;
        box-shadow: 0px 4px 8px 3px grey;
      }
    </style>
  </head>
  <body>
    <h1 align="center">DOM Demo Page 7</h1>

    <input type="checkbox" name="hobbies" value="Swim" /> Swimming
    <input type="checkbox" name="hobbies" value="Read" />Reading
    <input type="checkbox" name="hobbies" value="Sleep" />Sleeping
    <input type="checkbox" name="hobbies" value="Dance" />Dancing

    <button onclick="myfun()">Button</button>
    <button onclick="myfun2()">Select All</button>

    <script>
      let isChecked = false;
      function myfun2() {
        let checks = document.getElementsByName("hobbies");
        if (isChecked) {
          checks.forEach((checkbox) => (checkbox.checked = false));
        } else {
          checks.forEach((checkbox) => (checkbox.checked = true));
        }

        isChecked = !isChecked;
      }

      function myfun() {
        let checks = document.getElementsByName("hobbies");
        checks.forEach((checkbox) => {
          console.log(checkbox.value + " " + checkbox.checked);
        });
      }
    </script>
  </body>
</html>
