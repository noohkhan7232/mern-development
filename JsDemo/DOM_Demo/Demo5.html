<!DOCTYPE html>
<html lang="en">
<head>  
  <title>Document</title>
  
</head>
<body>
    
  <h1 align="center">DOM Demo Page 5</h1>
  
  <p id="myP">

  <button onclick="myfun()">Button</button>
